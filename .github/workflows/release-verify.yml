name: Release Verify
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  artifact:
    name: Release Verify / artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - shell: pwsh
        run: ./scripts/build-single-file.ps1
      - run: npm run validate
      - run: npm run build:offline
      - run: npm run test:smoke
      - run: npm run test:offline
      - name: Build release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item viewer.html dist/viewer.html
          Compress-Archive -Path dist/viewer.html -DestinationPath dist/claude-rescue-reader.zip
          if (!(Test-Path dist/offline/viewer.html) -or !(Test-Path dist/offline/vendor)) { throw 'Offline bundle is incomplete' }
          $vendorFiles = @(Get-ChildItem dist/offline/vendor -File)
          if (!$vendorFiles.Count) { throw 'Offline vendor directory is empty' }
          Compress-Archive -Path dist/offline/viewer.html,dist/offline/README.txt,dist/offline/THIRD_PARTY_NOTICES.txt,(Get-Item dist/offline/vendor) -DestinationPath dist/claude-rescue-reader-offline.zip
          @('viewer.html','claude-rescue-reader.zip','claude-rescue-reader-offline.zip') | ForEach-Object {
            (Get-FileHash (Join-Path dist $_) -Algorithm SHA256).Hash.ToLower() + '  ' + $_
          } | Set-Content dist/SHA256SUMS.txt
      - name: Verify package contents
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Select-Object -ExpandProperty Name
          if (Compare-Object @('SHA256SUMS.txt','claude-rescue-reader-offline.zip','claude-rescue-reader.zip','viewer.html') $files) { throw 'Unexpected release files' }
          $privatePathPatterns = @(
            '<<<<<<<|>>>>>>>'
            '[A-Za-z]:\\Users\\[^\\\s"''<>]+\\'
            '[A-Za-z]:\\Documents and Settings\\[^\\\s"''<>]+\\'
            '/Users/[A-Za-z0-9._-]+/'
            '/home/[A-Za-z0-9._-]+/'
          )
          if (Select-String -Path dist/viewer.html -Pattern $privatePathPatterns -Quiet) { throw 'Conflict marker or personal absolute path found in artifact' }
          Add-Type -AssemblyName System.IO.Compression
          $archive = $null
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/claude-rescue-reader.zip))
          try { $zipEntries = @($archive.Entries | ForEach-Object FullName) }
          finally { if ($archive) { $archive.Dispose() } }
          if ($zipEntries.Count -ne 1 -or $zipEntries[0] -ne 'viewer.html') { throw 'Unexpected ZIP contents' }
          foreach ($line in Get-Content dist/SHA256SUMS.txt) {
            $hash,$name = $line -split '\s+',2
            $actual = (Get-FileHash (Join-Path dist $name.Trim()) -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $actual) { throw "SHA-256 checksum mismatch: $name" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: claude-rescue-reader-${{ github.ref_name }}
          path: dist/
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHECKSUMS=$(cat dist/SHA256SUMS.txt)
          NOTES=$(printf '## SHA-256 Checksums\n\n```\n%s\n```\n' "$CHECKSUMS")
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/viewer.html \
              dist/claude-rescue-reader.zip \
              dist/claude-rescue-reader-offline.zip \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/viewer.html \
              dist/claude-rescue-reader.zip \
              dist/claude-rescue-reader-offline.zip \
              dist/SHA256SUMS.txt \
              --title "${GITHUB_REF_NAME} — Multi-AI Web Export Reader" \
              --notes "$NOTES" \
              --generate-notes \
              --verify-tag
          fi
